<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartPOS Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FFCA40;--yellow-2:#F2B92B;--red:#C8161D;--red-ink:#C8161D;--ink:#000;--gray:#808080;
  --surface:#F8F8F7;--card:#fff;--line:rgba(128,128,128,.2);--page:#ECECE6;--frame:#000;
  --green:#22A06B;--shadow:0 10px 28px rgba(20,20,20,.07);--hover:rgba(128,128,128,.09);
  --overlay:rgba(10,10,12,.5);--item-w:210px;--item-h:260px;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#F5F5F1;--gray:#9C9C9C;--surface:#1D1D21;--card:#141417;--line:rgba(255,255,255,.1);--page:#0E0E10;--red-ink:#FF6B71;--shadow:0 10px 28px rgba(0,0,0,.4);--hover:rgba(255,255,255,.06);--green:#3CC98B;color-scheme:dark}
}
:root[data-theme="dark"]{--ink:#F5F5F1;--gray:#9C9C9C;--surface:#1D1D21;--card:#141417;--line:rgba(255,255,255,.1);--page:#0E0E10;--red-ink:#FF6B71;--shadow:0 10px 28px rgba(0,0,0,.4);--hover:rgba(255,255,255,.06);--green:#3CC98B;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:500 .875rem/1.45 'Gilroy','Outfit','Noto Sans Khmer',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100dvh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
small{font-size:.75rem;color:var(--gray)}
b{font-weight:700}
.muted{color:var(--gray)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid #E0A800;outline-offset:2px}
.ic{flex:none}
.title{font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h2{font-size:1.5rem;font-weight:800;margin-bottom:.4rem}
h3.dh{font-size:1.2rem;font-weight:800}
h4{font-size:.95rem;font-weight:700;margin:1.3rem 0 .3rem}
.empty{color:var(--gray);text-align:center;padding:2rem 1rem}
.empty.sm{padding:1rem}
/* buttons + fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.2rem;border-radius:1rem;font-weight:700;transition:background .15s;white-space:nowrap}
.btn.sm{padding:.5rem .8rem;border-radius:.8rem;font-size:.75rem}
.btn.primary{background:var(--yellow);color:#000}.btn.primary:hover{background:var(--yellow-2)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}.btn.ghost:hover{background:var(--hover)}
.btn.dark{background:var(--ink);color:var(--card)}
.btn.danger{color:var(--red-ink);border:1px solid var(--red-ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{width:2.6rem;height:2.6rem;border-radius:.9rem;background:var(--surface);display:inline-grid;place-items:center;position:relative;flex:none}
.iconbtn:hover{background:var(--hover)}
.iconbtn.plain{background:none}
.iconbtn.sm{width:1.8rem;height:1.8rem;border-radius:.6rem}
.iconbtn.round{border-radius:50%}
.link{color:#3B6FD4;font-weight:600}
[data-theme="dark"] .link{color:#7FA6F5}
.field{width:100%;padding:.85rem 1rem;border-radius:.9rem;border:1px solid transparent;background:var(--surface);outline:none}
.field:focus{border-color:var(--yellow);background:var(--card)}
.field.sm{width:auto;padding:.5rem .8rem}
label.lab,div.lab{display:block;font-size:.75rem;color:var(--gray);font-weight:600}
.lab>.field{margin-top:.3rem;color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:.9rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.tag{display:inline-block;font-size:.7rem;padding:.15rem .5rem;border-radius:2rem;background:var(--hover);color:var(--gray);font-weight:700}
.tag.ok{background:rgba(34,160,107,.15);color:var(--green)}
.sw{position:relative;display:inline-block;width:2.75rem;height:1.5rem;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:2rem;background:rgba(255,202,64,.32);transition:.2s}
.sw i::after{content:"";position:absolute;top:.19rem;left:.19rem;width:1.12rem;height:1.12rem;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+i{background:var(--yellow)}
.sw input:checked+i::after{transform:translateX(1.25rem)}
.sw input:focus-visible+i{outline:2px solid #E0A800;outline-offset:2px}
.seg{display:inline-flex;background:var(--surface);border-radius:.9rem;padding:.25rem;gap:.2rem}
.seg button{padding:.5rem .9rem;border-radius:.7rem;font-weight:700;color:var(--gray);display:inline-flex;align-items:center;gap:.4rem}
.seg button.on{background:var(--yellow);color:#000}
.seg.full{display:flex}.seg.full button{flex:1;justify-content:center}
.stepper{display:inline-flex;align-items:center;gap:.6rem;background:var(--surface);border-radius:.8rem;padding:.2rem}
.stepper button{width:1.7rem;height:1.7rem;border-radius:.6rem;background:var(--card);font-weight:800;border:1px solid var(--line)}
.stepper b{min-width:1.4rem;text-align:center}
.av{border-radius:50%;display:inline-grid;place-items:center;font-weight:800;overflow:hidden;flex:none;background:var(--yellow);color:#000}
.av img{width:100%;height:100%;object-fit:cover}
/* popovers */
.pop-wrap{position:relative}
.pop{position:absolute;top:calc(100% + .4rem);left:0;min-width:16rem;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:1.1rem;padding:.4rem;z-index:40;max-height:22rem;overflow:auto}
.pop.right{left:auto;right:0}
.pop.up{top:auto;bottom:calc(100% + .4rem);right:0;left:auto;display:grid;grid-template-columns:repeat(6,1fr);min-width:15rem}
.pop.up button{font-size:1.3rem;padding:.35rem;border-radius:.5rem}.pop.up button:hover{background:var(--hover)}
.pop>a,.pop>button.mi{display:flex;align-items:center;gap:.6rem;padding:.65rem .8rem;border-radius:.7rem;width:100%;text-align:left;font-weight:600}
.pop>a:hover,.pop>button.mi:hover{background:var(--hover)}
.pop .ph{justify-content:space-between}.pop .ph span{display:flex;flex-direction:column}
.pop .pf{border-top:1px solid var(--line);margin-top:.3rem;padding:.5rem .8rem}
/* shell */
.app{height:100dvh;display:flex;background:var(--card);overflow:hidden;position:relative}
@media (min-width:900px){body{padding:.9rem}.app{height:calc(100dvh - 1.8rem);border:.6rem solid var(--frame);border-radius:2.2rem;box-shadow:0 20px 60px rgba(0,0,0,.18)}}
.side{width:15rem;flex:none;display:flex;flex-direction:column;justify-content:space-between;padding:1.3rem 1rem;border-right:1px solid var(--line);background:var(--card);overflow-y:auto;gap:1rem}
.brand{display:flex;align-items:center;gap:.7rem;padding:.3rem .6rem 1.3rem;font-size:1.2rem;font-weight:800}
.brand .logo{width:2.2rem;height:2.2rem;border-radius:.7rem;background:var(--red);color:#fff;display:grid;place-items:center}
.brand b span{color:var(--red-ink)}
.nav{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border-radius:1rem;color:var(--gray);font-weight:700;margin-bottom:.15rem}
.nav:hover{background:var(--hover)}.nav.on{background:var(--yellow);color:#000}
.nbadge{margin-left:auto;min-width:1.4rem;height:1.4rem;padding:0 .35rem;border-radius:1rem;background:var(--yellow);color:#000;font-size:.7rem;font-weight:800;display:grid;place-items:center}
.sec-label{font-size:.72rem;color:var(--gray);font-weight:600;padding:1.2rem 1rem .4rem}
.mecard{background:var(--surface);border-radius:1.4rem;padding:.9rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.15rem}
.mecard .btn{margin-top:.6rem;width:100%}
.copy{text-align:center;font-size:.7rem;color:var(--gray);margin-top:.6rem}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:4.4rem;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;gap:1rem}
.top-l,.top-r{display:flex;align-items:center;gap:.8rem;min-width:0}
.crumb{display:flex;align-items:center;gap:.4rem;color:var(--gray);white-space:nowrap;overflow:hidden}
.crumb b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.dotb{position:absolute;top:.25rem;right:.25rem;min-width:1rem;height:1rem;border-radius:1rem;background:var(--yellow);color:#000;font-size:.6rem;font-weight:800;display:grid;place-items:center;padding:0 .2rem}
.view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.page{padding:.2rem 2rem 1.5rem;overflow:auto;flex:1}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
.card{background:var(--surface);border-radius:1.5rem;padding:1.2rem 1.3rem}
.card h3{font-size:1rem;font-weight:800;margin-bottom:.8rem}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:1rem;margin-bottom:1rem}
.kpi small{display:flex;align-items:center;gap:.4rem}
.kpi b{display:block;font-size:1.8rem;font-weight:800;margin:.3rem 0;letter-spacing:-.02em}
.kpi.y{background:var(--yellow);color:#000}.kpi.y small{color:rgba(0,0,0,.6)}
.delta{font-weight:700;font-size:.75rem}.delta.up{color:var(--green)}.delta.down{color:var(--red-ink)}.kpi.y .delta{color:#000}
.dgrid{display:grid;grid-template-columns:1.7fr 1fr;gap:1rem;margin-bottom:1rem}
.dgrid.b{grid-template-columns:1fr 1fr}
.bars{display:flex;align-items:flex-end;gap:.35rem;height:12rem;padding-top:1rem}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:.3rem;min-width:0}
.bar i{width:100%;border-radius:.5rem .5rem .2rem .2rem;background:rgba(255,202,64,.45);min-height:3px}
.bar.max i{background:var(--yellow)}
.bar small{font-size:.65rem}
.rank{display:flex;align-items:center;gap:.7rem;padding:.5rem 0}
.rank .emo{width:2.4rem;height:2.4rem;border-radius:.8rem;display:grid;place-items:center;font-size:1.3rem;background:var(--hover)}
.rank .rk{flex:1;min-width:0}.rank .rk b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{height:.4rem;border-radius:1rem;background:var(--hover);margin-top:.3rem;overflow:hidden}.meter i{display:block;height:100%;background:var(--yellow);border-radius:1rem}
.meter.red i{background:var(--red)}
.orow{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.7rem .4rem;border-radius:.8rem}
.orow:hover{background:var(--hover)}
.orow span{display:flex;flex-direction:column}
.pill-s{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;font-weight:700}
.pill-s::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--yellow)}
.pill-s.done::before{background:var(--green)}.pill-s.cancelled::before{background:var(--red)}
/* food */
.food{flex:1;min-height:0;display:flex}
.fd-main{flex:1;min-width:0;display:flex;flex-direction:column;padding:0 1.5rem 1rem 2rem}
.fd-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.fd-tools{display:flex;gap:.6rem;align-items:center}
.search{display:flex;align-items:center;gap:.5rem;background:var(--surface);border-radius:.9rem;padding:0 .9rem;color:var(--gray)}
.search input{border:0;background:none;outline:none;padding:.75rem 0;min-width:0;width:100%}
.search.hidden{display:none}
.pills{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:1rem;flex:none}
.pill{padding:.6rem 1rem;border-radius:.9rem;background:var(--surface);color:var(--gray);font-weight:700;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--card)}.pill.on small{color:inherit;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--item-w),1fr));gap:1rem;overflow:auto;align-content:start;flex:1;padding:2px}
.item{position:relative;min-height:var(--item-h);background:var(--card);border:1px solid var(--line);border-radius:1.5rem;padding:.8rem;display:flex;flex-direction:column;gap:.6rem;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.item:hover{border-color:var(--yellow);box-shadow:var(--shadow)}
.item.sold{opacity:.55}
.emo-lg{flex:1;min-height:4rem;border-radius:1.1rem;display:grid;place-items:center;font-size:3.2rem}
.thumb{position:relative;flex:1;min-height:4rem;border-radius:1.1rem;display:grid;place-items:center;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .thumb-ic{position:relative;color:rgba(0,0,0,.32);display:flex}
[data-theme="dark"] .thumb .thumb-ic{color:rgba(255,255,255,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .thumb .thumb-ic{color:rgba(255,255,255,.35)}}
.thumb-sm{position:relative;width:2.2rem;height:2.2rem;border-radius:.7rem;display:grid;place-items:center;overflow:hidden;flex:none}
.thumb-sm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb-sm .thumb-ic{position:relative;color:rgba(0,0,0,.32);display:flex}
[data-theme="dark"] .thumb-sm .thumb-ic{color:rgba(255,255,255,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .thumb-sm .thumb-ic{color:rgba(255,255,255,.35)}}
.oi .thumb-sm,.rank .thumb-sm{width:2.6rem;height:2.6rem;border-radius:.8rem}
.pic-pick{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.pic-pick .thumb{flex:none;width:6rem;height:6rem;border:1px solid var(--line)}
.pic-pick .btns{display:flex;flex-direction:column;gap:.5rem;align-items:flex-start}
.i-info b{display:block}
.i-foot{display:flex;justify-content:space-between;align-items:center}
.price{font-size:1rem}
.plus{width:2rem;height:2rem;border-radius:.7rem;background:var(--yellow);color:#000;display:grid;place-items:center}
.item .edit{position:absolute;top:1.2rem;right:1.2rem;opacity:0;background:var(--card);z-index:2}
.item:hover .edit,.item .edit:focus-visible{opacity:1}
.incart{position:absolute;top:1.2rem;left:1.2rem;background:var(--ink);color:var(--card);border-radius:1rem;min-width:1.5rem;height:1.5rem;display:grid;place-items:center;font-size:.75rem;font-weight:800;padding:0 .4rem;z-index:2}
.cart{width:21rem;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;padding:1rem 1.2rem;background:var(--card);min-height:0}
.cart-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.8rem}
.cart-head h3{font-size:1rem;font-weight:800}
.cart-head .close-cart{display:none}
.cart-meta{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.6rem}
.cart-meta .span2{grid-column:1/-1}
.cart-meta .field{padding:.55rem .7rem;border-radius:.7rem}
.lines{flex:1;overflow:auto;min-height:6rem;border-top:1px solid var(--line)}
.line{display:flex;align-items:center;gap:.6rem;padding:.65rem 0;border-bottom:1px solid var(--line)}
.line .emo{width:2.2rem;height:2.2rem;border-radius:.7rem;background:var(--hover);display:grid;place-items:center;font-size:1.2rem}
.line .l-main{flex:1;min-width:0}.line .l-main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line em{display:block;font-size:.72rem;color:var(--gray);font-style:normal}
.price-s{color:var(--red-ink);font-weight:700;font-size:.78rem}
.empty-cart{text-align:center;color:var(--gray);padding:2.5rem 1rem}
.empty-cart p{margin-top:.6rem}
.cart-foot{border-top:1px solid var(--line);padding-top:.8rem;display:flex;flex-direction:column;gap:.6rem}
.disc{display:flex;align-items:center;justify-content:space-between;font-size:.8rem;color:var(--gray);font-weight:600}
.disc input{width:5rem;text-align:right;padding:.4rem .6rem}
.tl{display:flex;justify-content:space-between;color:var(--gray);font-weight:600;padding:.1rem 0}
.tl b{color:var(--ink)}
.tl.grand{font-size:1.1rem;color:var(--ink);font-weight:800;border-top:1px dashed var(--line);margin-top:.3rem;padding-top:.5rem}
.tl.grand b{color:var(--red-ink)}
.cart-btns{display:grid;grid-template-columns:1fr 1.3fr;gap:.6rem}
.cart-fab{display:none;position:absolute;right:1.2rem;bottom:1.2rem;z-index:20;background:var(--yellow);color:#000;border-radius:2rem;padding:.9rem 1.2rem;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.25);align-items:center;gap:.5rem}
/* bills */
.bills{flex:1;min-height:0;display:grid;grid-template-columns:minmax(19rem,25rem) 1fr}
.bl{padding:0 1.2rem 1rem 2rem;display:flex;flex-direction:column;min-height:0}
.bl-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.bl-filters{display:flex;gap:.5rem;margin-bottom:.8rem;flex-wrap:wrap}
.bl-filters .field{flex:1;min-width:6rem;padding:.4rem .6rem;font-size:.8rem}
.bl-list{flex:1;overflow:auto;padding:2px 2px 1rem}
.bcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:1.2rem;padding:.9rem 1.1rem;margin-bottom:.7rem;box-shadow:var(--shadow)}
.bcard.sel{border-color:var(--yellow);box-shadow:inset 0 0 0 1px var(--yellow),var(--shadow)}
.bcard .r{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.bcard .r1 b{font-size:1rem}.bcard .amt{font-weight:800;font-size:1rem}
.bcard .r2{color:var(--gray);font-size:.78rem;margin-top:.2rem}
.bd{background:var(--surface);border-radius:2rem 0 0 0;padding:1.2rem 2rem 1.5rem;overflow:auto}
.bd-top{display:flex;justify-content:flex-end;margin-bottom:.5rem}
.bd-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}
.badge{padding:.6rem 2rem;border-radius:.9rem;font-weight:700;background:var(--yellow);color:#000}
.badge.done{background:rgba(34,160,107,.18);color:var(--green)}.badge.cancelled{background:rgba(200,22,29,.14);color:var(--red-ink)}
.kv4{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin:.6rem 0 1rem}
.kv4 div{display:flex;flex-direction:column;gap:.2rem}.kv4 b{font-size:1rem}
.oi{display:flex;align-items:center;gap:.8rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.oi .emo{width:2.6rem;height:2.6rem;border-radius:.8rem;display:grid;place-items:center;font-size:1.4rem}
.oi span.n{flex:1;font-weight:600}
.bd-actions{display:flex;flex-direction:column;gap:.6rem;margin-top:1.3rem}
.bd-actions .row2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
/* messages */
.msgs{flex:1;min-height:0;display:grid;grid-template-columns:minmax(19rem,23rem) 1fr}
.ml{background:var(--surface);display:flex;flex-direction:column;min-height:0;padding:0 1.2rem 0 2rem}
.ml-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.ml .search{background:var(--card);margin-bottom:.8rem}
.ml-scroll{flex:1;overflow:auto;padding-bottom:1rem}
.gl{font-size:.7rem;color:var(--gray);font-weight:700;margin:.6rem 0 .5rem;letter-spacing:.02em}
.ccard{display:flex;gap:.8rem;align-items:center;background:var(--card);border:1px solid transparent;border-radius:1.2rem;padding:.8rem;margin-bottom:.6rem}
.ccard.on{border-color:var(--yellow);box-shadow:var(--shadow)}
.ccard .cc-main{flex:1;min-width:0}.ccard .cc-main b{display:block}
.prev{display:block;color:var(--gray);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-side{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem}
.ub{background:var(--red);color:#fff;border-radius:1rem;min-width:1.3rem;height:1.3rem;display:grid;place-items:center;font-size:.7rem;font-style:normal;font-weight:800;padding:0 .3rem}
.stack-av{display:flex}.stack-av .av{border:2px solid var(--card);margin-right:-.9rem}
.chat{display:flex;flex-direction:column;min-height:0;min-width:0;padding:0 2rem 1rem 1.5rem}
.ch-h{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-bottom:.8rem;flex-wrap:wrap}
.ch-who{display:flex;gap:.8rem;align-items:center}.ch-who b{display:block;font-size:1rem}
.ch-tools{display:flex;gap:.5rem;align-items:center}
.ch-tools .search{padding:0 .7rem}.ch-tools .search input{padding:.55rem 0;width:9rem}
.ch-scroll{flex:1;overflow:auto;display:flex;flex-direction:column;gap:.9rem;padding:.5rem .2rem}

.file span{display:flex;flex-direction:column}.file small,.voice small{color:inherit;opacity:.7}

.typing span{display:inline-block;width:.4rem;height:.4rem;border-radius:50%;background:var(--gray);margin:0 .12rem;animation:bl 1s infinite}

.sugg{display:flex;gap:.4rem;padding:.3rem 0;min-height:0;flex-wrap:wrap}

.composer{display:flex;align-items:center;gap:.4rem;background:var(--surface);border-radius:1.2rem;padding:.4rem .5rem}

.send{width:2.8rem;height:2.8rem;border-radius:.9rem;background:var(--yellow);color:#000;display:grid;place-items:center}

.call{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:.5rem}
.call-btns{display:flex;gap:1.2rem;margin-top:1rem}
.hang{width:3.4rem;height:3.4rem;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}

.row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.95rem 0;border-bottom:1px solid var(--line)}
.row p{font-size:.8rem;color:var(--gray);max-width:30rem}
.nhead,.nrow{display:grid;grid-template-columns:1fr 5rem 5rem;align-items:center;padding:.85rem 0;border-bottom:1px solid var(--line)}

.nitem.unread{border-color:var(--yellow);background:var(--card)}

.err{color:var(--red-ink);font-size:.8rem;min-height:1rem;font-weight:600}
.or{text-align:center;color:var(--gray);font-size:.8rem}
.social{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}

.gg{color:#4285F4;font-weight:800;font-size:1rem}.fb{width:1.2rem;height:1.2rem;border-radius:50%;background:#1877F2;color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:800}
.demo{background:var(--surface);border:1px dashed var(--line);border-radius:.9rem;padding:.6rem .8rem;font-size:.78rem;color:var(--gray);text-align:left}
.demo b{color:var(--ink)}
.banner{background:rgba(255,202,64,.2);border-radius:.9rem;padding:.7rem .9rem;font-size:.8rem}
.center{text-align:center;font-size:.8rem;color:var(--gray)}

@media (max-width:1100px){

  .cart.open{transform:none}.cart-head .close-cart{display:grid}
  .cart-fab{display:flex}
  .dgrid,.dgrid.b{grid-template-columns:1fr}
}
@media (max-width:900px){

  .mecard{padding:.4rem;background:none}
  .top{padding:0 1rem;height:3.8rem}.page{padding:.2rem 1rem 1rem}
  .fd-main{padding:0 1rem 1rem}

  .msgs[data-open="1"] .ml,.msgs[data-open="0"] .chat{display:none}
  .bl,.ml{padding-left:1rem}.bd{border-radius:0;padding:1rem}
  .chat{padding:0 1rem 1rem}

  .kv4{grid-template-columns:1fr 1fr}
  .auth-frame{grid-template-columns:1fr}.auth-art{display:none}.auth-form{padding:2rem 1.5rem}
  .form-cols,.two{grid-template-columns:1fr}
}
@media print{
  body *{visibility:hidden}
  .receipt,.receipt *{visibility:visible}
  .receipt{position:fixed;left:0;top:0;width:80mm;border:0}
  .ov{background:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function relTime(ts){
  const d=(ts-Date.now())/1000,a=Math.abs(d);
  if(a<45) return t('just_now');
  try{const rtf=new Intl.RelativeTimeFormat(lang(),{numeric:'auto'});
    if(a<3600) return rtf.format(Math.round(d/60),'minute');
    if(a<86400) return rtf.format(Math.round(d/3600),'hour');
    return rtf.format(Math.round(d/86400),'day');}
  catch(e){return fmtDate(ts)}
}
function dayLabel(ts){
  if(dayKey(ts)===dayKey(Date.now())) return t('today');

}

function totals(items,disc,rate){
  const subtotal=r2(items.reduce((s,i)=>s+i.price*i.qty,0));
  const discountAmt=r2(subtotal*(disc||0)/100);
  const tax=r2((subtotal-discountAmt)*(rate||0)/100);
  return {subtotal,discountAmt,tax,total:r2(subtotal-discountAmt+tax)};
}

async function loadShared(){

function onBillChange(p){
  if(!ME) return;
  if(p.eventType==='DELETE'){DB.bills=DB.bills.filter(b=>b.id!==p.old.id)}
  else{
    const b=billFromRow(p.new);upsertBill(b);
    if(p.eventType==='INSERT'&&p.new.created_by!==ME.id) notify('order','New order #'+b.id,'Table '+b.table+' · '+money(b.total)+' · '+b.by,'#/bills/'+b.id);
  }
  liveRefresh();
}
function onMenuChange(p){
  if(!ME) return;
  if(p.eventType==='DELETE') DB.menu=DB.menu.filter(m=>m.id!==p.old.id);
  else{const m=menuFromRow(p.new),i=DB.menu.findIndex(x=>x.id===m.id);if(i>=0)DB.menu[i]=m;else DB.menu.push(m)}
  if(currentView==='food'){drawPills();drawItems()}

function onMessageInsert(p){

  if(m.from!==ME.id){

    if(viewing) markRead(m.channel); else notify('message',m.name,m.text.slice(0,80),'#/messages/'+key);
  }

}
function subscribeRealtime(){
  unsubscribeRealtime();
  rtChan=sb.channel('smartpos-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'bills'},onBillChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'menu_items'},onMenuChange)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},onMessageInsert)
    .subscribe();
}

async function startSession(au,fresh){
  unsubscribeRealtime();
  const r=await sb.from('profiles').select('*').eq('id',au.id).maybeSingle();
  if(r.error) throw r.error;
  const p=r.data;
  if(!p) throw new Error('Your staff profile is missing. Run supabase.sql in the Supabase SQL editor, then sign in again.');
  ME={id:p.id,salesId:p.sales_id,name:p.name,email:p.email||au.email||'',phone:p.phone||'',role:p.role,avatar:p.avatar||null};
  UD={settings:merge(defaultSettings(),p.settings||{}),notifs:store.get('u'+ME.id+':notifs',[])};
  applyAppearance(UD.settings);
  CART=store.get('cart:'+ME.id,null)||newCart();
  let sh=store.get('shift:'+ME.id,null);
  if(fresh||!sh||Date.now()-sh>18*36e5){sh=Date.now();store.set('shift:'+ME.id,sh)}
  SHIFT=sh;
  LASTREAD=store.get('lr:'+ME.id,null);
  await Promise.all([loadShared(),loadStaff(),loadMessages()]);
  if(!LASTREAD){LASTREAD={};Object.keys(MSGS).forEach(markRead)}
  subscribeRealtime();
  timers.forEach(clearInterval);timers=[];
  timers.push(setInterval(()=>{updateMe();checkBillingAlerts()},30000));
  timers.push(setInterval(refreshShared,60000));
  checkBillingAlerts();
  askNotificationPermission();
}

const NMAP={message:'messages',order:'orders',payment:'payment',billing:'billing'};
function browserNotify(title,body){
  if(typeof Notification==='undefined'||Notification.permission!=='granted') return;
  if(!document.hidden) return;
  try{
    const n=new Notification(title,{body});
    n.onclick=()=>{try{window.focus()}catch(e){}n.close()};
  }catch(e){}
}
function askNotificationPermission(){
  if(typeof Notification==='undefined'||Notification.permission!=='default') return;
  try{Notification.requestPermission()}catch(e){}
}
function notify(type,title,text,link){
  if(!UD.settings.notif[NMAP[type]]) return false;
  UD.notifs.unshift({id:uid(),type,title,text,ts:Date.now(),read:false,link:link||''});
  UD.notifs=UD.notifs.slice(0,60);saveUD('notifs');badge();
  if(currentView==='notifications') VIEWS.notifications.draw();
  toast(title+': '+text,'ok',link);
  browserNotify(title,text);
  return true;
}
function badge(){
  const n=(UD.notifs||[]).filter(x=>!x.read).length;
  const b=$('#bell-badge'),nb=$('#nav-badge');
  if(b){b.textContent=n;b.hidden=!n}
  if(nb){nb.textContent=n;nb.hidden=!n}
}
function checkBillingAlerts(){
  if(!ME) return;
  const done=store.get('alerted:'+ME.id,{});let ch=false;
  DB.bills.forEach(b=>{
    if(b.status==='active'&&!done[b.id]&&Date.now()-b.createdAt>45*6e4){
      done[b.id]=1;ch=true;
      notify('billing','Billing alert','Order #'+b.id+' (table '+b.table+') has been open for 45+ minutes.','#/bills/'+b.id);
    }
  });
  if(ch) store.set('alerted:'+ME.id,done);
}

const setErr=m=>{const e=$('#auth-err');if(e)e.textContent=m};
FORMS.signin=async f=>{
  const email=f.elements.email.value.trim(),pw=f.elements.pw.value;
  if(!email||!pw) return setErr('Enter your email and password.');
  const btn=$('button.btn.primary',f);btn.disabled=true;setErr('');
  try{
    const r=await sb.auth.signInWithPassword({email,password:pw});
    if(r.error){setErr(/confirm/i.test(r.error.message)?'Please confirm your email first. Check your inbox.':'Email or password is incorrect.');return}
    await startSession(r.data.user,true);
    if(location.hash==='#/dashboard') route(); else location.hash='#/dashboard';
  }catch(e){setErr(e.message||'Couldn’t sign in.')}
  finally{btn.disabled=false}
};
FORMS.signup=async f=>{
  const v=n=>f.elements[n].value.trim();
  const name=v('name'),email=v('email'),pw=f.elements.pw.value;
  if(name.length<2) return setErr('Enter your full name.');
  if(!/^\S+@\S+\.\S+$/.test(email)) return setErr('Enter a valid email address.');
  if(pw.length<8) return setErr('Password needs at least 8 characters.');
  if(pw!==f.elements.pw2.value) return setErr('Passwords don’t match.');
  const btn=$('button.btn.primary',f);btn.disabled=true;setErr('');
  try{
    const r=await sb.auth.signUp({email,password:pw,options:{data:{name},emailRedirectTo:REDIRECT}});
    if(r.error){setErr(r.error.message);return}
    if(!r.data.session){
      $('.auth-form').innerHTML='<h1>Check your inbox</h1><p class="muted">We sent a confirmation link to <b>'+esc(email)+'</b>. Open it, then sign in.</p><a class="btn primary" href="#/signin">Go to sign in</a>';
      return;
    }
    await startSession(r.data.user,true);
    toast('Welcome to SmartPOS, '+name.split(' ')[0]+'!');
    if(location.hash==='#/dashboard') route(); else location.hash='#/dashboard';
  }catch(e){setErr(e.message||'Couldn’t create the account.')}
  finally{btn.disabled=false}
};

function stats(start,end){
  const done=DB.bills.filter(b=>b.status==='done'&&b.paidAt>=start&&b.paidAt<end);
  const created=DB.bills.filter(b=>b.status!=='cancelled'&&b.createdAt>=start&&b.createdAt<end);
  const sales=done.reduce((s,b)=>s+b.total,0);
  return {done,created,sales,avg:done.length?sales/done.length:0};
}
VIEWS.dashboard={
  mount(arg){
    if(arg==='week'||arg==='today') ui.dashRange=arg;
    setCrumb([{t:t('nav_dashboard')}]);
    $('#view').innerHTML='<div class="page"><div class="page-head"><div><h1 class="title">'+esc(t('nav_dashboard'))+'</h1><p class="muted" id="dash-sub"></p></div>'+
      '<div class="seg"><button data-act="range" data-r="today">'+esc(t('today'))+'</button><button data-act="range" data-r="week">'+esc(t('week'))+'</button></div></div><div id="dash-body"></div></div>';
    this.draw();
  },
  update(arg){if(arg==='week'||arg==='today')ui.dashRange=arg;this.draw()},
  draw(){
    const body=$('#dash-body');if(!body) return;
    const wk=ui.dashRange==='week',now=Date.now(),s0=sod(now);
    const start=wk?s0-6*864e5:s0,end=s0+864e5,len=end-start;
    const cur=stats(start,end),prev=stats(start-len,start);
    $$('[data-r]').forEach(b=>b.classList.toggle('on',b.dataset.r===ui.dashRange));
    $('#dash-sub').textContent=new Date(now).toLocaleDateString(R().locale,{weekday:'long',month:'long',day:'numeric'});
    const pct=prev.sales?(cur.sales-prev.sales)/prev.sales*100:null;
    const active=DB.bills.filter(b=>b.status==='active');
    let buckets;
    if(!wk){
      buckets=Array.from({length:15},(_,i)=>({l:String(i+8),v:0}));
      cur.done.forEach(b=>{const h=clamp(new Date(b.paidAt).getHours(),8,22);buckets[h-8].v+=b.total});
    }else{
      buckets=Array.from({length:7},(_,i)=>({l:new Date(start+i*864e5+36e5).toLocaleDateString(R().locale,{weekday:'short'}),v:0}));
      cur.done.forEach(b=>{const i=clamp(Math.round((sod(b.paidAt)-start)/864e5),0,6);buckets[i].v+=b.total});
    }
    const max=Math.max(1,...buckets.map(b=>b.v));
    const items={},cats={},pay={cash:0,card:0};
    cur.done.forEach(b=>{
      pay[b.method==='card'?'card':'cash']+=b.total;
      b.items.forEach(i=>{
        const k=i.name;items[k]=items[k]||{name:i.name,image:i.image,cat:i.cat,qty:0,rev:0};items[k].qty+=i.qty;items[k].rev+=i.price*i.qty;
        cats[i.cat]=(cats[i.cat]||0)+i.price*i.qty;
      });
    });
    const top=Object.values(items).sort((a,b)=>b.qty-a.qty).slice(0,5),topMax=top.length?top[0].qty:1;
    const catRows=Object.entries(cats).sort((a,b)=>b[1]-a[1]),catTot=catRows.reduce((s,c)=>s+c[1],0)||1;
    const payTot=(pay.cash+pay.card)||1;
    const recent=DB.bills.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,6);
    body.innerHTML=
    '<div class="kpis">'+
     '<div class="card kpi y"><small>'+ico('cash',16)+' '+(wk?'Sales, 7 days':'Sales today')+'</small><b>'+money(cur.sales)+'</b>'+(pct===null?'<span class="delta">No earlier sales to compare</span>':'<span class="delta">'+(pct>=0?'▲ ':'▼ ')+Math.abs(pct).toFixed(0)+'% vs '+(wk?'previous 7 days':'yesterday')+'</span>')+'</div>'+
     '<div class="card kpi"><small>'+ico('file',16)+' Orders</small><b>'+cur.created.length+'</b><small>'+cur.done.length+' paid</small></div>'+
     '<div class="card kpi"><small>'+ico('clock',16)+' Open orders</small><b>'+active.length+'</b><small>'+(active.length?'<a class="link" href="#/bills">View bills</a>':'All caught up')+'</small></div>'+
     '<div class="card kpi"><small>'+ico('users',16)+' Average order</small><b>'+money(cur.avg)+'</b><small>per paid order</small></div></div>'+
    '<div class="dgrid"><div class="card"><h3>'+(wk?'Sales by day':'Sales by hour')+'</h3><div class="bars" role="img" aria-label="Sales chart">'+buckets.map(b=>'<div class="bar '+(b.v===max&&b.v>0?'max':'')+'" title="'+esc(b.l+': '+money(b.v))+'"><i style="height:'+Math.max(2,b.v/max*100*.82)+'%"></i><small>'+esc(b.l)+'</small></div>').join('')+'</div></div>'+
     '<div class="card"><h3>Top items</h3>'+(top.length?top.map(i=>'<div class="rank">'+thumb(i,'thumb-sm')+'<div class="rk"><b>'+esc(i.name)+'</b><small>'+i.qty+' sold · '+money(i.rev)+'</small><div class="meter"><i style="width:'+i.qty/topMax*100+'%"></i></div></div></div>').join(''):'<p class="empty sm">No paid orders in this period yet.</p>')+'</div></div>'+
    '<div class="dgrid b"><div class="card"><h3>Sales by category</h3>'+(catRows.length?catRows.map(c=>'<div class="rank"><div class="rk"><b>'+esc(c[0])+' <small>'+Math.round(c[1]/catTot*100)+'%</small></b><div class="meter"><i style="width:'+c[1]/catTot*100+'%"></i></div></div><b>'+money(c[1])+'</b></div>').join(''):'<p class="empty sm">Nothing sold yet.</p>')+'</div>'+
     '<div class="card"><h3>Payment methods</h3>'+['cash','card'].map(k=>'<div class="rank"><span class="emo">'+ico(k==='card'?'card':'cash',18)+'</span><div class="rk"><b>'+(k==='card'?'Bank card':'Cash')+' <small>'+Math.round(pay[k]/payTot*100)+'%</small></b><div class="meter '+(k==='card'?'red':'')+'"><i style="width:'+pay[k]/payTot*100+'%"></i></div></div><b>'+money(pay[k])+'</b></div>').join('')+'</div></div>'+
    '<div class="card"><h3>Recent orders</h3>'+recent.map(b=>'<a class="orow" href="#/bills/'+b.id+'"><span><b>Order #'+b.id+'</b><small>Table '+esc(b.table)+' · '+esc(b.customer)+' · '+fmtTime(b.createdAt)+'</small></span><span style="align-items:flex-end"><b>'+money(b.total)+'</b><span class="pill-s '+b.status+'">'+esc(t(b.status))+'</span></span></a>').join('')+'</div>';
  }
};

async function submitCart(charge){
  if(!CART.items.length) return toast('Add at least one item first','warn');
  if(busy) return;busy=true;
  try{
    const tot=totals(CART.items,CART.discount,UD.settings.taxRate);
    const base=Object.assign({status:'active',table:CART.table,guests:CART.guests,customer:CART.customer.trim()||'Walk-in',method:CART.method,items:clone(CART.items),discount:CART.discount,taxRate:UD.settings.taxRate},tot);
    let bill,edit=false;
    if(CART.editing){
      const r=await sb.from('bills').update(billToRow(base)).eq('id',CART.editing).eq('status','active').select().maybeSingle();
      if(r.error) throw r.error;
      if(!r.data){
        toast('That order was already paid or cancelled on another terminal','warn');
        CART=newCart();saveCart();syncCart();drawItems();refreshShared();return;
      }
      bill=billFromRow(r.data);edit=true;
    }else{
      const r=await sb.from('bills').insert(Object.assign(billToRow(base),{by_name:ME.name})).select().single();
      if(r.error) throw r.error;
      bill=billFromRow(r.data);
    }
    upsertBill(bill);
    CART=newCart();saveCart();syncCart();drawItems();
    const c=$('.cart');if(c)c.classList.remove('open');
    if(charge) openPay(bill.id); else toast('Order #'+bill.id+(edit?' updated':' sent to the kitchen'),'ok','#/bills/'+bill.id);
  }catch(e){dbErr(e,'Couldn’t save the order. Check your connection and try again.')}
  finally{busy=false}
}

function itemModal(id){
  const m=id?DB.menu.find(x=>x.id===id):{name:'',cat:'Cold Drinks',price:'',image:'',sold:false};
  let img=m.image||'';
  const md=openModal('<h3 class="dh">'+(id?'Edit item':'New menu item')+'</h3><form class="stack">'+
   '<label class="lab">Name<input class="field" name="name" value="'+esc(m.name)+'" required maxlength="40"></label>'+
   '<div class="two"><label class="lab">Category<select class="field" name="cat">'+CATS.map(c=>'<option '+(c===m.cat?'selected':'')+'>'+c+'</option>').join('')+'</select></label>'+
   '<label class="lab">Price ($)<input class="field" name="price" type="number" min="0" step="0.01" value="'+m.price+'" required></label></div>'+
   '<div><span class="lab" style="display:block;margin-bottom:.4rem">Photo</span><div class="pic-pick" id="pic-pick">'+pickerHTML(img)+'</div>'+
   '<input class="field" id="pic-url" style="margin-top:.6rem" placeholder="'+(img.indexOf('data:')===0?'Photo uploaded — paste a link to replace it':'or paste an image link (https://...)')+'" value="'+(img.indexOf('data:')===0?'':esc(img))+'"></div>'+
   '<label class="row" style="border:0;padding:.2rem 0"><span>Sold out</span><span class="sw"><input type="checkbox" name="sold" '+(m.sold?'checked':'')+'><i></i></span></label>'+
   '<div class="dfoot">'+(id?'<button type="button" class="btn danger" data-act="item-del" data-id="'+id+'">Delete</button>':'')+'<button type="button" class="btn ghost" data-act="close-modal">Cancel</button><button class="btn primary">Save</button></div></form>');
  const refreshPic=()=>{$('#pic-pick',md).innerHTML=pickerHTML(img)};
  md.addEventListener('input',e=>{if(e.target.id==='pic-url'){img=e.target.value.trim();refreshPic()}});
  md.addEventListener('change',e=>{
    if(e.target.id!=='item-photo-input') return;
    const f=e.target.files[0];if(!f) return;
    if(!/^image\//.test(f.type)) return toast('Choose an image file','warn');
    const rd=new FileReader();
    rd.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const S=480,c=document.createElement('canvas');c.width=S;c.height=S;
        const mn=Math.min(im.width,im.height);
        c.getContext('2d').drawImage(im,(im.width-mn)/2,(im.height-mn)/2,mn,mn,0,0,S,S);
        img=c.toDataURL('image/jpeg',.82);
        const u=$('#pic-url',md);u.value='';u.placeholder='Photo uploaded — paste a link to replace it';
        refreshPic();
      };
      im.onerror=()=>toast('That image couldn’t be read','warn');
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  });
  md.addEventListener('click',e=>{
    if(e.target.id!=='pic-clear') return;
    img='';const u=$('#pic-url',md);u.value='';u.placeholder='or paste an image link (https://...)';refreshPic();
  });
  $('form',md).onsubmit=async e=>{
    e.preventDefault();const f=e.target.elements;
    const name=f.name.value.trim(),price=parseFloat(f.price.value);
    if(!name||!(price>=0)) return toast('Enter a name and a valid price','warn');
    const data={name,cat:f.cat.value,price:r2(price),image:img,sold:f.sold.checked};
    try{
      const q=id?sb.from('menu_items').update(menuToRow(data)).eq('id',id):sb.from('menu_items').insert(menuToRow(data));
      const r=await q.select().maybeSingle();
      if(r.error) throw r.error;
      if(!r.data) return toast('Only managers can change the menu','warn');
      const row=menuFromRow(r.data),i=DB.menu.findIndex(x=>x.id===row.id);
      if(i>=0) DB.menu[i]=row; else DB.menu.push(row);
      closeModal();drawPills();drawItems();toast(id?'Item updated':'Item added');
    }catch(err){dbErr(err,'Couldn’t save the item')}
  };
}

/* ===================== PAYMENT + RECEIPT ===================== */
function openPay(id){
  const b=DB.bills.find(x=>x.id===id);if(!b||b.status!=='active') return;
  const en=['cash','card'].filter(k=>UD.settings.methods[k]);
  let method=en.includes(b.method)?b.method:en[0],recv=b.total;
  const m=openModal('<div class="dh-row"><h3 class="dh">Charge Order #'+b.id+'</h3><button class="iconbtn sm" data-act="close-modal" aria-label="Close">'+ico('x',16)+'</button></div>'+
   '<div class="pay-total"><small>Amount due</small><b>'+money(b.total)+'</b><small>Table '+esc(b.table)+' · '+esc(b.customer)+'</small></div>'+
   '<div class="seg full" id="pay-seg">'+en.map(k=>'<button data-pm="'+k+'">'+ico(k==='card'?'card':'cash',16)+' '+(k==='card'?'Bank card':'Cash')+'</button>').join('')+'</div>'+
   '<div id="pay-body"></div><button class="btn primary block" id="pay-ok">Confirm payment</button>');
  const upd=()=>{
    const ch=$('#pay-change',m);if(ch)ch.textContent=money(Math.max(0,r2(recv-b.total)));
    $('#pay-ok',m).disabled=method==='cash'&&!(recv>=b.total-0.0001);
  };
  const draw=()=>{
    $$('#pay-seg button',m).forEach(x=>x.classList.toggle('on',x.dataset.pm===method));
    if(method==='cash'){
      const q=Array.from(new Set([b.total,Math.ceil(b.total/5)*5,Math.ceil(b.total/10)*10,Math.ceil(b.total/20)*20,Math.ceil(b.total/50)*50].map(r2)));
      $('#pay-body',m).innerHTML='<label class="lab">Amount received<input id="pay-recv" class="field" type="number" min="0" step="0.01" value="'+recv+'"></label>'+
        '<div class="chips">'+q.map(v=>'<button data-q="'+v+'">'+money(v)+'</button>').join('')+'</div><div class="tl grand"><span>Change due</span><b id="pay-change"></b></div>';
    }else{
      $('#pay-body',m).innerHTML='<div class="cardbox">'+ico('card',28)+'<p>Present the card on the payment terminal, then confirm once the terminal shows <b>Approved</b>.</p><small>Card details are never entered or stored in this app.</small></div>';
    }
    upd();
  };
  m.addEventListener('click',e=>{
    const pm=e.target.closest('[data-pm]');if(pm){method=pm.dataset.pm;draw();return}
    const q=e.target.closest('[data-q]');if(q){recv=+q.dataset.q;$('#pay-recv',m).value=recv;upd()}
  });
  m.addEventListener('input',e=>{if(e.target.id==='pay-recv'){recv=parseFloat(e.target.value)||0;upd()}});
  $('#pay-ok',m).onclick=()=>payBill(b.id,method,method==='cash'?recv:b.total);
  draw();
}
async function payBill(id,method,tendered){
  const b=DB.bills.find(x=>x.id===id);if(!b||b.status!=='active') return;
  const btn=$('#pay-ok');if(btn)btn.disabled=true;
  try{
    const r=await sb.from('bills').update({status:'done',paid_at:new Date().toISOString(),method,tendered:r2(tendered),change_due:r2(Math.max(0,tendered-b.total))}).eq('id',id).eq('status','active').select().maybeSingle();
    if(r.error) throw r.error;
    if(!r.data){closeModal();toast('That order was already paid or cancelled on another terminal','warn');refreshShared();return}
    upsertBill(billFromRow(r.data));
    closeModal();
    if(!notify('payment','Payment successful','Order #'+id+' · '+money(b.total)+' paid by '+(method==='card'?'card':'cash'),'#/bills/'+id)) toast('Order #'+id+' paid');
    if(UD.settings.showReceipt) openReceipt(id);
    liveRefresh();
  }catch(e){dbErr(e,'Payment wasn’t saved, so the order is still open. Try again.');if(btn)btn.disabled=false}
}

const EMOJIS=['😀','😂','😊','😍','😎','🤘','👍','🙏','🔥','🎉','😅','😔','👏','✅','⏰','🍕','🍔','☕','💪','🙌','❤️','😉','🤝','👌'];
const WORDS='order table please thanks thank ready kitchen customer bill payment waiter manager coffee burger pizza pasta dessert menu special promotion complete completed working service shift break help need urgent minutes moment sure okay great today tomorrow tonight lunch dinner breakfast check clean guests reservation allergy refill'.split(' ');
const dmChan=(a,b)=>'dm:'+[a,b].sort().join('_');
const staffById=id=>id===(ME&&ME.id)?ME:STAFF.find(s=>s.id===id);
function chatList(){
  const out=[{key:'everyone',channel:'everyone',type:'team',name:'Everyone',info:(STAFF.length||1)+' member'+((STAFF.length||1)>1?'s':'')}];
  if(ME.role==='Manager') out.push({key:'managers',channel:'managers',type:'team',name:'Managers',info:'Managers only'});
  STAFF.filter(s=>s.id!==ME.id).forEach(s=>out.push({key:'dm-'+s.id,channel:dmChan(ME.id,s.id),type:'personal',name:s.name,info:s.role,avatar:s.avatar,peer:s}));
  return out;
}
const chatByKey=k=>chatList().find(c=>c.key===k);
const msgsOf=ch=>MSGS[ch]||[];
const lastTs=c=>{const l=msgsOf(c.channel);return l.length?l[l.length-1].ts:0};
const unreadOf=c=>msgsOf(c.channel).filter(m=>m.from!==ME.id&&m.ts>((LASTREAD&&LASTREAD[c.channel])||0)).length;
const keyForChannel=ch=>ch==='everyone'||ch==='managers'?ch:'dm-'+ch.slice(3).split('_').find(x=>x!==ME.id);
const chatAv=(c,size)=>av(c.name,size,c.avatar);
function drawChatList(){
  const el=$('#chat-list');if(!el) return;
  const q=ui.listQ.trim().toLowerCase();
  const list=chatList().filter(c=>!q||c.name.toLowerCase().includes(q)||msgsOf(c.channel).some(m=>m.text.toLowerCase().includes(q)));
  const card=c=>{
    const l=msgsOf(c.channel),lm=l[l.length-1],un=unreadOf(c);
    const who=lm?(lm.from===ME.id?'You: ':c.type==='team'?lm.name.split(' ')[0]+': ':''):'';
    return '<a class="ccard '+(c.key===ui.chat?'on':'')+'" href="#/messages/'+c.key+'">'+chatAv(c,46)+
     '<div class="cc-main"><b>'+esc(c.name)+'</b><span class="prev">'+esc(lm?who+lm.text:c.info)+'</span></div><div class="cc-side"><small>'+(lm?esc(relTime(lm.ts)):'')+'</small>'+(un?'<i class="ub">'+un+'</i>':'')+'</div></a>';
  };
  const teams=list.filter(c=>c.type==='team'),pers=list.filter(c=>c.type!=='team').sort((a,b)=>lastTs(b)-lastTs(a)||a.name.localeCompare(b.name));
  el.innerHTML=(teams.length?'<div class="gl">TEAMS</div>'+teams.map(card).join(''):'')+(pers.length?'<div class="gl">PERSONAL</div>'+pers.map(card).join(''):'')||'<p class="empty">No chats found.</p>';
}
function msgHTML(m,c){
  const mine=m.from===ME.id,s=staffById(m.from);
  return '<div class="m '+(mine?'me':'')+'">'+(mine?'':av(m.name,36,s&&s.avatar))+'<div class="mb"><div class="bub">'+(!mine&&c.type==='team'?'<span class="sn">'+esc(m.name)+'</span>':'')+esc(m.text).replace(/\n/g,'<br>')+'</div><small class="mt">'+fmtTime(m.ts)+'</small></div></div>';
}
function drawMsgs(){
  const el=$('#ch-scroll');const c=chatByKey(ui.chat);if(!el||!c) return;
  const q=ui.chatQ.trim().toLowerCase();
  const all=msgsOf(c.channel),msgs=q?all.filter(m=>m.text.toLowerCase().includes(q)):all;
  let last='';const out=[];
  msgs.forEach(m=>{const k=dayKey(m.ts);if(k!==last){out.push('<div class="day">'+esc(dayLabel(m.ts))+'</div>');last=k}out.push(msgHTML(m,c))});
  el.innerHTML=out.join('')||'<p class="empty">'+(q?'No messages match your search.':'No messages yet. Say hello!')+'</p>';
  if(!q) el.scrollTop=el.scrollHeight;
}
function drawChatPane(){
  const c=chatByKey(ui.chat);const pane=$('#chat-pane');if(!c||!pane) return;
  pane.innerHTML=
  '<header class="ch-h"><div class="ch-who">'+chatAv(c,46)+'<div><b>'+esc(c.name)+'</b><small>'+esc(c.info)+'</small></div></div>'+
  '<div class="ch-tools"><div class="search">'+ico('search',15)+'<input data-in="chatq" placeholder="Search in chat" aria-label="Search in chat" value="'+esc(ui.chatQ)+'"></div></div></header>'+

  '<div class="pop-wrap"><button class="iconbtn plain" data-act="pop" data-p="emoji" aria-label="Emoji">'+ico('smile',18)+'</button><div class="pop up" id="pop-emoji" hidden>'+EMOJIS.map(e=>'<button data-act="emoji-pick" data-e="'+e+'">'+e+'</button>').join('')+'</div></div>'+
  '<button class="send" data-act="chat-send" aria-label="Send">'+ico('send',18)+'</button></footer>';

}

function vocab(){
  const seen={};Object.keys(MSGS).forEach(ch=>MSGS[ch].forEach(m=>{m.text.toLowerCase().split(/[^a-z']+/).forEach(w=>{if(w.length>=3)seen[w]=(seen[w]||0)+1})}));
  const mine=Object.keys(seen).sort((a,b)=>seen[b]-seen[a]);
  return Array.from(new Set(WORDS.concat(mine)));
}
function drawSugg(){
  const box=$('#sugg'),inp=$('#cin');if(!box||!inp) return;
  if(!UD.settings.predictive){box.innerHTML='';return}
  const v=inp.value,mt=v.match(/(\S+)$/);
  if(!mt||/\s$/.test(v)||mt[1].length<2){box.innerHTML='';return}
  const w=mt[1].toLowerCase();
  box.innerHTML=vocab().filter(x=>x.startsWith(w)&&x!==w).slice(0,4).map(x=>'<button data-act="sugg" data-w="'+esc(x)+'">'+esc(x)+'</button>').join('');
}
ACT.sugg=el=>{const i=$('#cin');i.value=i.value.replace(/(\S+)$/,el.dataset.w+' ');i.focus();drawSugg()};

  '<h4>Payment method</h4><div class="row"><span>Bank card</span>'+sw('methods.card','Bank card')+'</div><div class="row"><span>Cash</span>'+sw('methods.cash','Cash')+'</div>'+
  '<h4>Orders</h4><div class="row"><span>Tax rate (%)</span><input class="field sm" style="width:6rem;text-align:right" type="number" min="0" max="50" step="0.5" value="'+draft.taxRate+'" data-in="dtax" aria-label="Tax rate percent"></div>'+
  '<div class="row"><span>Show receipt after payment</span>'+sw('showReceipt','Show receipt after payment')+'</div>'+saveBtn;
 },
 security(){
  return '<h2>Security</h2><h4 style="margin-top:.4rem">Where you’re logged in</h4><div class="sess">'+ico('monitor',20)+'<div><b>'+esc(deviceLabel())+' <span class="tag ok">This device</span></b><small>Active now</small></div></div>'+
  '<p class="muted" style="margin:.8rem 0">Signed in somewhere else, or lost a device? Sign out everywhere except here.</p><div><button class="btn ghost" data-act="sess-all">Sign out of all other devices</button></div>'+
  '<h4>Password</h4><p class="muted">Change it under Profile → Login &amp; password.</p><div style="margin-top:.6rem"><a class="btn ghost" href="#/settings/profile">Go to profile</a></div>';
 },
 language(){
  return '<h2>Language &amp; Region</h2><div class="stack" style="margin-top:.6rem"><label class="lab">Choose region<select class="field" data-ch="dpath" data-path="region">'+Object.keys(REGIONS).map(k=>'<option value="'+k+'" '+(draft.region===k?'selected':'')+'>'+REGIONS[k].label+'</option>').join('')+'</select></label>'+
  '<label class="lab">Choose language<select class="field" data-ch="dpath" data-path="lang">'+Object.keys(LANGS).map(k=>'<option value="'+k+'" '+(draft.lang===k?'selected':'')+'>'+LANGS[k]+'</option>').join('')+'</select></label></div>'+
  '<div class="row"><div><b>Predictive text suggestions</b><p>See word suggestions while you type in Messages.</p></div>'+sw('predictive','Predictive text')+'</div>'+
  '<p class="muted" style="margin-top:.6rem">Region sets date and time formats. Language translates navigation and main labels; other text stays in English. All prices are in US dollars.</p>'+saveBtn;
 }
};
function drawSettings(){
  const b=$('#set-body');if(!b) return;
  b.innerHTML=SEC[ui.setsec]();
  $$('.set-item').forEach(a=>a.classList.toggle('on',a.dataset.sec===ui.setsec));
  const s=SET_SECS.find(x=>x[0]===ui.setsec);
  setCrumb([{t:t('nav_settings'),href:'#/settings'},{t:t(s[2])}]);
}
VIEWS.settings={
  mount(arg){
    draft=clone(UD.settings);
    cleanups.push(()=>{if(draft){draft=null;applyAppearance(UD.settings)}});
    ui.setsec=SET_SECS.some(s=>s[0]===arg)?arg:'profile';
    $('#view').innerHTML='<div class="page"><h1 class="title">'+esc(t('nav_settings'))+'</h1><div class="set-wrap"><nav class="set-menu" aria-label="Settings sections">'+SET_SECS.map(s=>'<a class="set-item" href="#/settings/'+s[0]+'" data-sec="'+s[0]+'">'+ico(s[1],18)+'<span>'+esc(t(s[2]))+'</span></a>').join('')+'</nav><section class="set-body" id="set-body"></section></div></div>';
    drawSettings();
  },
  update(arg){ui.setsec=SET_SECS.some(s=>s[0]===arg)?arg:'profile';drawSettings()}
};
CHANGE.dpath=el=>{
  const p=el.dataset.path,val=el.type==='checkbox'?el.checked:el.value;
  if(p.indexOf('methods.')===0&&!val){
    const other=p==='methods.card'?'methods.cash':'methods.card';
    if(!getPath(draft,other)){el.checked=true;return toast('Keep at least one payment method on','warn')}
  }
  setPath(draft,p,val);
};
CHANGE.dtheme=el=>{draft.theme=el.checked?el.dataset.v:(el.dataset.v==='light'?'dark':'light');applyAppearance(draft);drawSettings()};
CHANGE.dcard=el=>{draft.card=el.value;applyAppearance(draft)};
INPUT.dtax=el=>{draft.taxRate=clamp(Number(el.value)||0,0,50)};
ACT.fs=el=>{draft.fontSize=clamp(draft.fontSize+ +el.dataset.d,12,22);applyAppearance(draft);$('#fs-val').textContent=draft.fontSize};
ACT['save-settings']=()=>{
  const langChanged=draft.lang!==UD.settings.lang;
  UD.settings=clone(draft);saveUD('settings');applyAppearance(UD.settings);
  toast('Changes saved');
  if(langChanged) refreshApp(); else if(CART) {if($('#cart')) drawCart()}
};
ACT['sess-all']=async()=>{
  const r=await sb.auth.signOut({scope:'others'});
  if(r.error) dbErr(r.error,'Couldn’t sign out other devices'); else toast('Signed out of all other devices');
};
ACT['avatar-del']=async()=>{if(await saveProfile({avatar:null})){ME.avatar=null;updateMe();drawSettings()}};
CHANGE.avatar=el=>{
  const f=el.files[0];if(!f) return;
  if(!/^image\//.test(f.type)) return toast('Choose an image file','warn');
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=async()=>{
      const S=160,c=document.createElement('canvas');c.width=c.height=S;
      const m=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
      const url=c.toDataURL('image/jpeg',.85);
      if(await saveProfile({avatar:url})){ME.avatar=url;updateMe();if(currentView==='settings')drawSettings();toast('Photo updated')}
    };
    img.onerror=()=>toast('That image couldn’t be read','warn');
    img.src=rd.result;
  };
  rd.readAsDataURL(f);el.value='';
};
FORMS.profile=async f=>{
  const name=f.elements.name.value.trim(),phone=f.elements.phone.value.trim();
  if(name.length<2) return toast('Enter your full name','warn');
  if(await saveProfile({name,phone})){ME.name=name;ME.phone=phone;updateMe();toast('Profile saved')}
};
FORMS.password=async f=>{
  const cur=f.elements.cur.value,pw=f.elements.pw.value;
  if(pw.length<8) return toast('New password needs at least 8 characters','warn');
  if(pw!==f.elements.pw2.value) return toast('New passwords don’t match','warn');
  const chk=await sb.auth.signInWithPassword({email:ME.email,password:cur});
  if(chk.error) return toast('Current password is incorrect','warn');
  const r=await sb.auth.updateUser({password:pw});
  if(r.error) return toast(r.error.message,'warn');
  f.reset();toast('Password updated');
};

/* ===================== global actions + events ===================== */
ACT['close-modal']=()=>closeModal();
ACT.pop=el=>{const p=$('#pop-'+el.dataset.p);if(!p) return;const was=p.hidden;closePops();p.hidden=!was};
ACT.back=()=>{if(history.length>1)history.back();else location.hash='#/dashboard'};
ACT.logout=()=>logout();
ACT['theme-toggle']=()=>{
  const nt=effTheme(UD.settings)==='dark'?'light':'dark';
  UD.settings.theme=nt;saveUD('settings');applyAppearance(UD.settings);if(draft)draft.theme=nt;closePops();
};
document.addEventListener('click',e=>{
  if(!e.target.closest('.pop-wrap')) closePops();
  const el=e.target.closest('[data-act]');if(!el) return;
  const fn=ACT[el.dataset.act];if(fn) fn(el,e);
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-in]');if(!el) return;
  if(el.dataset.in==='digits'){el.value=el.value.replace(/\D/g,'');return}
  if(INPUT[el.dataset.in]) INPUT[el.dataset.in](el,e);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-ch]');if(el&&CHANGE[el.dataset.ch]) CHANGE[el.dataset.ch](el,e);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f) return;
  e.preventDefault();FORMS[f.dataset.form](f,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();closePops()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}
  if(e.key==='Enter'&&e.target.id==='cin'){e.preventDefault();ACT['chat-send']()}
});

/* ===================== init ===================== */
function showFatal(msg){
  root.innerHTML='<div class="auth"><div class="dlg" style="max-width:32rem"><h3 class="dh">SmartPOS couldn’t start</h3><p class="muted">'+esc(msg)+'</p><div class="dfoot"><button class="btn primary" onclick="location.reload()">Try again</button></div></div></div>';
}
applyAppearance(defaultSettings());
if(!window.supabase||!SUPABASE_URL||!SUPABASE_ANON_KEY){
  showFatal('The Supabase library didn’t load, or the project URL and key are missing. Check your connection and the settings at the top of the script.');
  return;
}
sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
sb.auth.onAuthStateChange(ev=>{
  if(ev==='PASSWORD_RECOVERY') setTimeout(openRecovery,300);
  else if(ev==='SIGNED_OUT'&&ME&&!loggingOut) setTimeout(localLogout,0);
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshShared()});
root.innerHTML='<div class="auth"><p class="muted">Loading…</p></div>';
try{
  const s=await sb.auth.getSession();
  if(s.data&&s.data.session) await startSession(s.data.session.user,false);
}catch(e){
  console.error(e);
  showFatal(e.message||'Could not reach the database. Check your connection and that supabase.sql has been run.');
  return;
}
route();
})();
</script>
</body>
